services:
  citeguard:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    # Optional LLM refine (leave unset for extractive mode):
    # LLM_API_KEY: ${LLM_API_KEY}
    # LLM_BASE_URL: ${LLM_BASE_URL}
    # LLM_MODEL: ${LLM_MODEL}
    restart: unless-stopped
